<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Gemini</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 310px;
      background: #131317;
      color: #f1f3f4;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .sub {
      font-size: 12px;
      color: #9aa0a6;
      margin-top: 1px;
    }
    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 14.5px;
      font-weight: 600;
      color: #131314;
      background: linear-gradient(95deg, #8ab4f8 0%, #c58af9 55%, #f28b82 100%);
      cursor: pointer;
      margin-bottom: 12px;
    }
    .card {
      background: #1e1e24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row label {
      font-size: 13.5px;
      color: #e8eaed;
    }
    select {
      background: #2b2b33;
      color: #f1f3f4;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 13px;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #8ab4f8;
    }
    .secondary-btn {
      width: 100%;
      background: #282830;
      color: #e8eaed;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .hint {
      font-size: 11.5px;
      color: #9aa0a6;
      line-height: 1.4;
      margin: 4px 0 0 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-64.png" alt="Ask Gemini" />
    <div>
      <h1>Ask Gemini</h1>
      <div class="sub">Uses your signed-in Safari subscription</div>
    </div>
  </div>

  <button class="primary-btn" id="summonBtn" type="button">✨ Ask Gemini on This Page</button>

  <div class="card">
    <div class="row">
      <label for="showMiniBtn">Mini top-left button</label>
      <input type="checkbox" id="showMiniBtn" checked />
    </div>

    <div class="row">
      <label for="btnSize">Button size</label>
      <select id="btnSize">
        <option value="24">Tiny (24 px)</option>
        <option value="28" selected>Mini (28 px)</option>
        <option value="34">Compact (34 px)</option>
      </select>
    </div>

    <div class="row">
      <label for="idleOpacity">Idle visibility</label>
      <select id="idleOpacity">
        <option value="0.45">Subtle (45%)</option>
        <option value="0.7" selected>Balanced (70%)</option>
        <option value="0.95">Crisp (95%)</option>
      </select>
    </div>

    <div class="row">
      <label for="autoReturn">Auto-return on wake</label>
      <input type="checkbox" id="autoReturn" />
    </div>

    <button class="secondary-btn" id="resetPosBtn" type="button">Reset Button to Top-Left</button>
  </div>

  <button class="secondary-btn" id="openGeminiWebBtn" type="button">Open gemini.google.com (Sign In) ↗</button>
  <p class="hint">Tip: Keep one <strong>gemini.google.com</strong> tab signed in for instant inline answers without API keys.</p>

  <script src="popup.js"></script>
</body>
</html>
